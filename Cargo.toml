[package]
name = "prueba2"
version = "0.1.0"
authors = ["EzeLRA <ezeleocraft@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = [] }
#chrono = "0.4"
#serde_json = "1.0.149"
#tokio = "1.50.0"
#log = "0.4.29"
dioxus-web = "0.7.3"
gloo-timers = "0.3.0"
js-sys = "0.3.91"
wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4.64"
web-sys = "0.3.91"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
